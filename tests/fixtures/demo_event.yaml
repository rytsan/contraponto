articles:
  - id: "demo-art-001"
    source_id: "demo_veiculo_a"
    titulo: "[DEMO] Paralisação no transporte paralisa corredores financeiros e gera prejuízo estimado em R$ 180 milhões ao comércio"
    url_canonica: "https://demo-a.contraponto.local/economia/paralisacao-transporte-prejuizo-comercio"
    guid: "demo-guid-001"
    veiculo: "Veículo Demo A — Diário Mercantil (Posição Editorial: Fictícia Liberal)"
    autor: "Editoria de Mercado Demo (Fictícia)"
    data_publicacao: "2026-10-28T08:30:00+00:00"
    resumo: "Entidades patronais cobram rigor judicial contra greve e apontam impacto sobre metas de produtividade e contratos de concessão."
    idioma: "pt"
    metodo_coleta: "rss_full"
    texto_limpo: >-
      A paralisação iniciada às 4h da manhã pelos operadores do sistema metropolitano de transporte em São Paulo provocou congestionamentos recordes e esvaziou centros comerciais nesta quarta-feira. Segundo levantamento divulgado pela Federação Empresarial Metropolitana Fictícia (FEMF), o varejo e o setor de serviços deixam de faturar cerca de R$ 180 milhões por dia de interrupção das linhas concedidas.
      Diretores do Consórcio ViaPrivada Demo declararam que a exigência sindical de redução da jornada semanal sem corte salarial viola o equilíbrio econômico-financeiro dos contratos de concessão assinados com o poder concedente. Para os analistas de investimentos ouvidos pela reportagem, ceder à pressão grevista criaria insegurança jurídica para os próximos leilões de privatização da malha ferroviária urbana.
      No final da manhã, a procuradoria estadual obteve liminar determinando o retorno imediato de 85% dos trabalhadores aos postos, sob pena de multa diária de R$ 600 mil contra o sindicato da categoria e autorização para atuação da tropa de choque nas garagens.

  - id: "demo-art-002"
    source_id: "demo_veiculo_b"
    titulo: "[DEMO] Trabalhadores do transporte cruzam os braços contra terceirização, escala exaustiva e remessa recorde de lucros"
    url_canonica: "https://demo-b.contraponto.local/lutas/trabalhadores-transporte-greve-contra-terceirizacao"
    guid: "demo-guid-002"
    veiculo: "Veículo Demo B — Tribuna Operária (Posição Editorial: Fictícia Sindical)"
    autor: "Coletivo de Base Demo (Fictício)"
    data_publicacao: "2026-10-28T09:15:00+00:00"
    resumo: "Assembleia com 4 mil operários denuncia cortes na manutenção, jornadas extenuantes e subsídios bilionários pagos pelo Estado às concessionárias."
    idioma: "pt"
    metodo_coleta: "rss_full"
    texto_limpo: >-
      Mais de 4 mil trabalhadores entre maquinistas, motoristas e técnicos de manutenção aprovaram em assembleia geral a greve unificada do transporte metropolitano em São Paulo. O Sindicato Unificado dos Trabalhadores em Transporte Demo (SUTTD) denuncia a imposição de jornadas exaustivas sob escalas 6x1, a demissão de técnicos experientes substituídos por contratos terceirizados precarizados e a queda constante na segurança operacional dos trens e ônibus.
      De acordo com o balanço financeiro analisado pelo departamento econômico do sindicato, o Consórcio ViaPrivada Demo recebeu R$ 2,4 bilhões em subsídios diretos do orçamento público estadual no último ano e distribuiu R$ 790 milhões em dividendos aos seus fundos acionistas, enquanto ofereceu reajuste abaixo da inflação para a categoria.
      Comitês de usuários dos bairros periféricos e o Movimento Popular pelo Transporte Público Demo realizaram atos conjuntos nas estações em apoio aos grevistas, exigindo congelamento da tarifa, reversão das privatizações e controle público e social sobre as planilhas de custos do sistema.

  - id: "demo-art-003"
    source_id: "demo_veiculo_c"
    titulo: "[DEMO] Secretaria de Transportes instala mesa de conciliação e determina operação de contingência nas linhas metropolitanas"
    url_canonica: "https://demo-c.contraponto.local/institucional/secretaria-mesa-conciliacao-contingencia"
    guid: "demo-guid-003"
    veiculo: "Veículo Demo C — Boletim Oficial (Posição Editorial: Fictícia Institucional)"
    autor: "Agência Pública Demo (Fictícia)"
    data_publicacao: "2026-10-28T11:00:00+00:00"
    resumo: "Órgão regulador acompanha cumprimento de frota mínima determinada pelo Tribunal Regional do Trabalho e convoca audiência."
    idioma: "pt"
    metodo_coleta: "trafilatura"
    texto_limpo: >-
      A Secretaria Estadual de Transportes Metropolitanos Demo informou em nota oficial que ativou o Plano de Contingência Operacional às 5h30 desta quarta-feira para mitigar os impactos da paralisação dos trabalhadores metroferroviários e rodoviários na Região Metropolitana de São Paulo.
      Segundo o comunicado institucional, fiscais da agência reguladora monitoram nas estações o cumprimento da decisão cautelar do Tribunal Regional do Trabalho, que fixou frota mínima de 85% nos horários de pico e 60% nos demais períodos, sob pena de multa diária de R$ 600 mil.
      Uma audiência de conciliação entre representantes do Consórcio ViaPrivada Demo, dirigentes do Sindicato Unificado dos Trabalhadores em Transporte Demo (SUTTD) e o Ministério Público do Trabalho foi agendada para as 17h na sede do tribunal em São Paulo.

