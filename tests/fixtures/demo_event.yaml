  marxist_leninist_analysis:
    central_contradiction: "Contradição entre o caráter social e essencial do transporte público metropolitano — produzido coletivamente pelos trabalhadores e financiado pela população via impostos e tarifas — e a apropriação privada dos resultados pelo Consórcio ViaPrivada Demo sob a forma de dividendos bilionários."
    class_relations: "Enfrentamento direto entre o proletariado do setor de transportes (aliado às camadas trabalhadoras periféricas usuárias do sistema) e a fração burguesa concessionária de serviços públicos, respaldada pela burguesia comercial e financeira (FEMF)."
    property_and_power: "O modelo de concessão privada transfere a gestão de uma infraestrutura pública estratégica para fundos privados que detêm o poder de demitir, terceirizar e comprimir salários, ao mesmo tempo em que socializam os custos operacionais por meio de R$ 2,4 bilhões em subsídios estatais."
    role_of_state: "Longe de atuar como árbitro neutro como sugere o boletim institucional (Veículo Demo C), o Estado burguês opera em duas frentes complementares: garante a acumulação privada via subsídios orçamentários e aciona imediatamente seu braço jurídico-repressivo (liminar de 85% de frota, multa de R$ 600 mil e tropa de choque) para inviabilizar na prática o direito de greve."
    imperialism_or_dependency: "sem_evidencia_suficiente"
    ideology_and_naturalization: "A cobertura liberal (Veículo Demo A) naturaliza o lucro contratual sob o jargão técnico de 'equilíbrio econômico-financeiro' e 'segurança jurídica', enquanto converte o direito elementar de resistência contra a escala 6x1 em 'prejuízo ao comércio' e 'caos urbano'."
    hegemony_and_silenced_voices: "No noticiário mercantil, federações patronais, diretores de concessionárias e analistas financeiros falam como representantes da racionalidade econômica universal, enquanto os trabalhadores que operam os trens e sofrem o desgaste físico têm suas razões silenciadas; somente na imprensa sindical e popular (Veículo Demo B) a relação entre subsídio público, dividendo privado e precarização vem à tona."
    forms_of_struggle: "Assembleia geral massiva de base, greve unificada por tempo indeterminado e construção de unidade ativa com comitês populares de usuários nas estações."
    immediate_demand: "Redução da jornada semanal sem redução salarial, fim da escala 6x1, suspensão imediata das terceirizações, revogação das multas antissindicais e abertura pública das planilhas de custos e subsídios da concessionária."
    strategic_perspective: "Reversão das privatizações e reestatização integral do transporte coletivo metropolitano sob controle público direto dos trabalhadores do setor e dos conselhos populares de usuários, rumo à tarifa zero financiada progressivamente sobre o grande capital."
    limitations_and_uncertainty:
      - "Este dossiê utiliza dados 100% sintéticos de demonstração (DEMO) e não se refere a veículos reais."
      - "As matérias não informam a composição acionária internacional ou estrangeira dos fundos controladores do consórcio."

  reader_questions:
    - "Por que a transferência de R$ 2,4 bilhões do orçamento público para uma concessionária privada é tratada como cumprimento técnico de contrato, enquanto a reivindicação salarial dos trabalhadores é tratada como ameaça fiscal?"
    - "Quem aparece como sujeito legítimo quando o jornal comercial mede os efeitos de uma greve apenas pelo faturamento diário do varejo e nunca pelo desgaste físico da escala 6x1?"
    - "Qual é o sentido real do direito constitucional de greve quando o aparato judiciário impõe 85% de operação compulsória sob multa de R$ 600 mil por dia?"

